name: Build NewsMorocco Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create . --platforms=android --org=com.newsmorocco --project-name=news_morocco

      - name: Prepare app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert -background none assets/icon.svg -resize 1024x1024 assets/icon.png

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewsMorocco-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: NewsMorocco-AAB
          path: build/app/outputs/bundle/release/app-release.aab
