name: Build NewsMorocco Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create . --platforms=android --org=com.newsmorocco --project-name=news_morocco

      - name: Enable internet access for release APK
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Prepare app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert -background none assets/icon.svg -resize 1024x1024 assets/icon.png

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Prepare APK for release
        run: cp build/app/outputs/flutter-apk/app-release.apk NewsMorocco.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NewsMorocco v1.0.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: NewsMorocco.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewsMorocco-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: NewsMorocco-AAB
          path: build/app/outputs/bundle/release/app-release.aab
